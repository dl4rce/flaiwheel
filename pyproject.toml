[project]
name = "flaiwheel"
version = "3.12.1"
description = "Flywheel with AI, for AI – self-improving knowledge base for AI coding agents"
readme = "README.md"
license = {text = "BUSL-1.1"}
requires-python = ">=3.11"

dependencies = [
    # mcp 2.0 removed mcp.server.fastmcp (FastMCP -> mcpserver). Migrating is a
    # separate piece of work; until then the major must be bounded, or a fresh
    # resolve silently picks 2.x and every import of server.py fails.
    "mcp[cli]>=1.0.0,<2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
    "pypdf>=4.0.0",
    "beautifulsoup4>=4.12.0",
    "python-docx>=1.0.0",
    "bm25s>=0.2.0",
]

[project.optional-dependencies]
# Full production install — adds vector DB and local embedding model.
# Required for indexing and semantic search. Use: pip install '.[full]'
full = [
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
]
openai = ["openai>=1.0.0"]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/flaiwheel"]
