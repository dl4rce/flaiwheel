[project]
name = "flaiwheel"
version = "3.14.0"
description = "Flywheel with AI, for AI – self-improving knowledge base for AI coding agents"
readme = "README.md"
license = {text = "BUSL-1.1"}
requires-python = ">=3.11"

# Every runtime dependency is capped below the NEXT major. An unbounded `>=X`
# is a promise that no future major will ever break us — a promise no upstream
# makes. It fails silently: the bad release lands, existing environments keep
# working off a stale resolve, and the breakage only appears on the next fresh
# install (CI, a Docker rebuild, a new contributor). On 2026-08-19 `mcp` 2.0.0
# removed `mcp.server.fastmcp` and took out CI and the Docker build together,
# three weeks after release, while every dev machine stayed green.
# Raise a cap deliberately, with the test suite green against the new major.
dependencies = [
    # mcp 2.0 removed mcp.server.fastmcp (FastMCP -> mcpserver). Migrating is a
    # separate piece of work; until then the major must be bounded, or a fresh
    # resolve silently picks 2.x and every import of server.py fails.
    #
    # Floor raised 1.0.0 -> 1.23.0 (CVE-2025-66416 / GHSA-9h52-p55h-vw2f):
    # before 1.23.0 the SDK disabled DNS rebinding protection by default and
    # FastMCP had no auto-enable, so a fresh install could resolve to a build
    # where the guard server.py now configures, documents and tests does not
    # exist. 1.23.0 is also the first release guaranteed to accept the
    # `host` / `transport_security` arguments we pass explicitly.
    "mcp[cli]>=1.23.0,<2.0.0",
    # 0.x projects: minor bumps are the breaking unit, but capping at <1.0.0
    # still blocks the 1.0 rewrite, which is the failure mode that matters.
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    # Floor raised 2.0.0 -> 2.7.0 for the `NoDecode` annotation (added in
    # 2.7.0), which lets MCP_SSE_ALLOWED_HOSTS accept a comma-separated list
    # instead of erroring on anything that is not JSON. Raised deliberately:
    # same major, and the alternative is a startup crash on the syntax people
    # naturally type into `docker run -e`.
    "pydantic-settings>=2.7.0,<3.0.0",
    "pypdf>=4.0.0,<7.0.0",
    "beautifulsoup4>=4.12.0,<5.0.0",
    "python-docx>=1.0.0,<2.0.0",
    "bm25s>=0.2.0,<1.0.0",
]

[project.optional-dependencies]
# Full production install — adds vector DB and local embedding model.
# Required for indexing and semantic search. Use: pip install '.[full]'
full = [
    # chromadb resolves to 1.x despite the >=0.5.0 floor — the vectorstore is
    # the one dependency whose breaking change costs a full re-index, so cap it.
    "chromadb>=0.5.0,<2.0.0",
    "sentence-transformers>=3.0.0,<7.0.0",
]
openai = ["openai>=1.0.0,<3.0.0"]
dev = [
    "pytest>=8.0,<10.0",
    "httpx>=0.27,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/flaiwheel"]
